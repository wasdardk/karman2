<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Карман">
<meta name="theme-color" content="#0F2027">
<meta name="robots" content="noindex">
<title>Карман</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F2027; --surface:#16303A; --surface2:#1C3945; --line:#264652;
  --ink:#EEE9E0; --muted:#9DB0B3; --brass:#E3B34C; --rose:#EF7A6A; --sage:#7CC5A0;
  --c1:#E3B34C; --c2:#8FB8DE; --c3:#C58FD1; --c4:#7CC5A0; --c5:#EF7A6A;
  --shadow:0 12px 40px rgba(0,0,0,.35);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F4F7F6; --line:#D9E2E0;
    --ink:#10262E; --muted:#5C7176; --brass:#B7851B; --rose:#D0503F; --sage:#2E8A5E;
    --c1:#C99425; --c2:#3F7CB5; --c3:#9A55AC; --c4:#2E8A5E; --c5:#D0503F;
    --shadow:0 12px 40px rgba(16,38,46,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F4F7F6; --line:#D9E2E0;
  --ink:#10262E; --muted:#5C7176; --brass:#B7851B; --rose:#D0503F; --sage:#2E8A5E;
  --c1:#C99425; --c2:#3F7CB5; --c3:#9A55AC; --c4:#2E8A5E; --c5:#D0503F;
  --shadow:0 12px 40px rgba(16,38,46,.14); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F2027; --surface:#16303A; --surface2:#1C3945; --line:#264652;
  --ink:#EEE9E0; --muted:#9DB0B3; --brass:#E3B34C; --rose:#EF7A6A; --sage:#7CC5A0;
  --c1:#E3B34C; --c2:#8FB8DE; --c3:#C58FD1; --c4:#7CC5A0; --c5:#EF7A6A;
  --shadow:0 12px 40px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding:18px 18px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.brand{font-family:"Unbounded","Onest",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{background:none;border:0;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--surface2);color:var(--ink)}
.month span{min-width:110px;text-align:center;font-weight:600;font-size:14px}

/* hero */
.hero{padding:6px 2px 22px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-family:"Unbounded","Onest",sans-serif;font-weight:700;font-size:clamp(34px,10vw,46px);letter-spacing:-.02em;line-height:1.1;margin:6px 0 16px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.panel h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio div{min-width:0}
.trio small{display:block;color:var(--muted);font-size:12.5px}
.trio strong{display:block;font-size:clamp(14px,4.2vw,17px);font-weight:700;white-space:nowrap}
.pos{color:var(--sage)} .neg{color:var(--rose)} .gold{color:var(--brass)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv strong{font-size:17px}

.bars .b{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.bars .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--rose);border-radius:4px}
.bars .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .val{font-weight:600;font-size:13.5px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}

/* holdings */
.hold{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.hold:last-child{border-bottom:0}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0F2027;flex:none}
.hold .nm{font-weight:600}
.hold .sub{color:var(--muted);font-size:13px}
.hold .rt{text-align:right}
.hold .rt .v{font-weight:700}
.hold .rt .pl{font-size:13px}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0}

/* tx */
.day{margin:18px 2px 6px;color:var(--muted);font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;text-align:left}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:18px}
.tx .c{font-weight:600}
.tx .n{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:64px}
nav.tabs button.t{background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav.tabs button.t svg{width:22px;height:22px}
nav.tabs button.t[aria-current="page"]{color:var(--ink)}
nav.tabs button.t[aria-current="page"] svg{color:var(--brass)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--brass);color:#1a1405;font-size:30px;line-height:1;box-shadow:var(--shadow);transform:translateY(-10px)}
.fab:active{transform:translateY(-8px) scale(.97)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);margin-bottom:16px;padding-bottom:4px}
.amt input{border:0;background:none;outline:none;font-family:"Unbounded","Onest",sans-serif;font-size:36px;font-weight:700;width:100%;min-width:0}
.amt span{font-size:22px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--brass);border-color:var(--brass);color:#1a1405;font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--brass);color:#1a1405}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--rose);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 14px}
.snaps{font-size:13.5px;margin:4px 0 14px}
.snaps div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
textarea.backup{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.linkbtn{background:none;border:0;color:var(--brass);font-weight:600;padding:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}


.delta{font-weight:700;font-size:17px;margin:-8px 0 14px}
.delta span{font-weight:500;color:var(--muted);font-size:14px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.split.in{grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:16px;padding:14px;margin:12px 0}
.split small{display:block;color:var(--muted);font-size:12.5px}
.split strong{display:block;font-size:clamp(14px,4.2vw,17px);font-weight:700;white-space:nowrap}
.split em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.pbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.pbar .neg{font-size:13px}
.dh{display:flex;gap:12px;align-items:center}
.dh .sub{color:var(--muted);font-size:13px}
.res{display:flex;flex-direction:column;gap:6px;margin:-4px 0 10px}
.resrow{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.resrow b{text-transform:uppercase}
.resrow span{color:var(--muted);font-size:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ph h2{margin:0}
.rng{display:flex;gap:2px;background:var(--surface2);border-radius:10px;padding:2px}
.rng button{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 9px;border-radius:8px}
.rng button.on{background:var(--surface);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 12px}
.actions .btn{min-width:120px}
label.btn{display:block;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <button class="t" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Обзор</button>
    <button class="t" data-tab="port"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Портфель</button>
    <button class="fab" id="fab" aria-label="Добавить операцию">+</button>
    <button class="t" data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операции</button>
    <button class="t" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ещё</button>
  </div>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const KEY = "karman.v2";
const IN_CATS = [["Зарплата","💼"],["Подработка","🛠️"],["Кешбек TR","💳"],["Saveback TR","🌱"],["Проценты TR","🏦"],["Продажа крипты","🪙"],["Подарок","🎁"],["Другое","✨"]];
const OUT_CATS = [["Еда","🛒"],["Кафе","☕"],["Жильё","🏠"],["Транспорт","🚇"],["Связь","📱"],["Подписки","🔁"],["Одежда","👕"],["Здоровье","💊"],["Спорт","🥊"],["Развлечения","🎮"],["Учёба","📚"],["Техника","💻"],["Другое","📦"]];
const COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_P = ["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
const CG = "https://api.coingecko.com/api/v3";

/* ---------- utils ---------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const num = v => { if (v===null||v===undefined||v==="") return NaN; return parseFloat(String(v).replace(/\s/g,"").replace(",",".")); };
const fmt = (n,d=2) => (isFinite(n)?n:0).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = n => fmt(n)+" €";
const eurS = n => (Math.abs(n)>=1000?fmt(n,0):fmt(n))+" €";
const qty = n => { if(!isFinite(n)) return "0"; return n.toLocaleString("ru-RU",{maximumFractionDigits: Math.abs(n)<1?6:4}); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dstr = s => { const [y,m,d]=s.split("-").map(Number); return `${d} ${MONTHS_G[m-1]} ${y}`; };
const sign = n => Math.abs(n)<1e-9?"":n>0?"+":"−";

/* ---------- state ---------- */
function blank(){
  return { v:2, show:"EUR", fx:{usdEur:null, at:0}, apiKey:"", holdings:[
    mkHold({kind:"crypto", sym:"SOL", name:"Solana", cg:"solana", place:"Jupiter, нативный стейкинг", apy:4.95, pending:8}),
    mkHold({kind:"crypto", sym:"wstETH", name:"Lido wstETH", cg:"wrapped-steth", mode:"ratio", under:"ethereum", underSym:"ETH", place:"MetaMask", apy:2.2, pending:0.04171}),
    mkHold({kind:"crypto", sym:"APE", name:"ApeCoin", cg:"apecoin", place:"Кошелёк", apy:0, pending:0})
  ], tx:[] };
}
function mkHold(o){
  return Object.assign({id:uid(), kind:"crypto", sym:"", name:"", cg:null, ticker:null, mode:"plain", under:null, underSym:null,
    place:"", apy:0, qty:0, price:null, uPrice:null, priceAt:0, started:false, pending:null, bUnits:0, bCost:0, events:[]}, o);
}
function migrateV1(s){
  const out = blank(); out.holdings = []; out.tx = Array.isArray(s.tx)?s.tx:[];
  (s.holdings||[]).forEach(h=>{
    const known = {sol:["solana","plain"], wsteth:["wrapped-steth","ratio"], ape:["apecoin","plain"], eth:["ethereum","plain"], btc:["bitcoin","plain"]}[String(h.sym).toLowerCase()];
    out.holdings.push(mkHold({kind:"crypto", sym:h.sym, name:h.sym, cg: known?known[0]:null, mode: known?known[1]:"plain",
      under: known&&known[1]==="ratio"?"ethereum":null, underSym: known&&known[1]==="ratio"?"ETH":null,
      place:h.place||"", apy:h.apy||0, pending: h.qty||0 }));
  });
  return out;
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s=JSON.parse(raw); if (s && s.v===2) return s; }
    const old = localStorage.getItem("karman.v1");
    if (old) { const s=JSON.parse(old); if (s && Array.isArray(s.holdings)) return migrateV1(s); }
  } catch(e){}
  return blank();
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Не получилось сохранить в браузере"); } }

/* ---------- money display ---------- */
const fx = () => S.fx.usdEur || 0.92;            // 1 USD = x EUR
const sym = () => S.show==="USD" ? "$" : "€";
const toShow = e => S.show==="USD" ? e/fx() : e;  // internal is EUR
const fromShow = v => S.show==="USD" ? v*fx() : v;
const money = e => { const v=toShow(e); return S.show==="USD" ? (v<0?"−$":"$")+fmt(Math.abs(v)) : (v<0?"−":"")+fmt(Math.abs(v))+" €"; };
const moneyS = e => { const v=toShow(e); const s = Math.abs(v)>=1000?fmt(Math.abs(v),0):fmt(Math.abs(v)); return S.show==="USD" ? (v<0?"−$":"$")+s : (v<0?"−":"")+s+" €"; };
const signed = e => { if(Math.abs(e)<0.005) e=0; return (e>0?"+":e<0?"−":"") + money(Math.abs(e)); };

/* ---------- holdings math ---------- */
function R(h){ if(h.mode!=="ratio") return 1; if(h.ratio) return h.ratio; return (h.price&&h.uPrice) ? h.price/h.uPrice : null; }
function U(h){ return h.mode==="ratio" ? h.uPrice : h.price; }
function calc(h){
  const value = (h.qty||0)*(h.price||0);
  if(!h.started) return {value, cost:0, pe:0, se:0, tot:0, pct:null, stakeUnits:0};
  const r=R(h), u=U(h);
  const pe = (r!=null&&u!=null) ? h.bUnits*u - h.bCost : 0;
  const stakeUnits = r!=null ? h.qty*r - h.bUnits : 0;
  const se = u!=null ? stakeUnits*u : 0;
  const tot = value - h.bCost;
  return {value, cost:h.bCost, pe, se, tot, pct: h.bCost>0? tot/h.bCost : null, stakeUnits};
}
function canPrice(h){ return h.price!=null && (h.mode!=="ratio" || h.uPrice!=null); }
function startIfReady(h){
  if(h.started || !canPrice(h)) return;
  const q = h.pending!=null ? h.pending : h.qty;
  if(!(q>0)) { h.qty = 0; return; }
  const r=R(h);
  h.qty=q; h.bUnits=q*r; h.bCost=q*h.price; h.started=true; h.pending=null; if(h.ratio) h.exact=true;
  h.events.push({d:today(), t:"start", dq:q, q, p:h.price, r});
}
function applyEvent(h, t, newQtyOrDq){
  const r=R(h);
  if(t==="buy"){ const dq=newQtyOrDq; h.bUnits+=dq*r; h.bCost+=dq*h.price; h.qty+=dq; h.events.push({d:today(),t,dq,q:h.qty,p:h.price,r}); }
  else if(t==="sell"){ const dq=Math.min(newQtyOrDq,h.qty); const f=h.qty>0?dq/h.qty:0; h.bUnits-=h.bUnits*f; h.bCost-=h.bCost*f; h.qty-=dq; h.events.push({d:today(),t,dq,q:h.qty,p:h.price,r}); }
  else if(t==="reward"){ const nq=newQtyOrDq; const dq=nq-h.qty; h.qty=nq; h.events.push({d:today(),t,dq,q:nq,p:h.price,r}); }
}

async function fromCoinGecko(){
  const ids = new Set(["tether"]);
  S.holdings.forEach(h=>{ if(h.cg) ids.add(h.cg); if(h.mode==="ratio"&&h.under) ids.add(h.under); });
  const res = await fetch(`${CG}/simple/price?ids=${[...ids].join(",")}&vs_currencies=eur,usd`, {cache:"no-store"});
  if(!res.ok) throw new Error("CoinGecko "+res.status);
  const j = await res.json(); const done=new Set();
  if(j.tether && j.tether.eur && j.tether.usd) S.fx = {usdEur: j.tether.eur/j.tether.usd, at: Date.now()};
  S.holdings.forEach(h=>{
    if(h.cg && j[h.cg] && j[h.cg].eur!=null){
      if(h.mode==="ratio"){ if(h.under && j[h.under] && j[h.under].eur!=null){ h.uPrice=j[h.under].eur; const r=h.ratio || (j[h.cg].eur/h.uPrice); h.price=h.uPrice*r; h.lastRatio=r; } else return; }
      else h.price=j[h.cg].eur;
      h.priceAt=Date.now(); h.src="live"; done.add(h.id);
    }
  });
  return done;
}
async function fromBinance(skip){
  // запасной источник: пары к USDT на Binance
  const need = S.holdings.filter(h=>h.kind==="crypto" && !skip.has(h.id));
  const syms = new Set(); need.forEach(h=>syms.add(((h.mode==="ratio"?h.underSym:h.sym)||"").toUpperCase()));
  const px = {};
  await Promise.allSettled([...syms].filter(Boolean).map(async s=>{
    const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${encodeURIComponent(s)}USDT`, {cache:"no-store"});
    if(!r.ok) return; const j = await r.json(); if(j && j.price) px[s]=parseFloat(j.price);
  }));
  let n=0;
  need.forEach(h=>{
    if(h.mode==="ratio"){ const u=px[(h.underSym||"").toUpperCase()]; const ratio = h.ratio || h.lastRatio || (h.price&&h.uPrice? h.price/h.uPrice : null);
      if(u && ratio){ h.uPrice=u*fx(); h.price=h.uPrice*ratio; h.priceAt=Date.now(); h.src="live"; n++; } }
    else { const p=px[h.sym.toUpperCase()]; if(p){ h.price=p*fx(); h.priceAt=Date.now(); h.src="live"; n++; } }
  });
  return n;
}
const WSTETH = "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0";
const RPCS = ["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com","https://1rpc.io/eth"];
async function onchainRatio(){
  // stEthPerToken() в контракте wstETH (Lido): точный курс, сколько stETH (=ETH) стоит 1 wstETH
  for(const url of RPCS){
    try{
      const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:WSTETH,data:"0x035faf82"},"latest"]})});
      const j = await r.json();
      if(j && j.result && j.result.length>2){ const v = Number(BigInt(j.result))/1e18; if(v>1 && v<3) return v; }
    }catch(e){}
  }
  return null;
}
async function applyOnchain(){
  const hs = S.holdings.filter(h=>h.mode==="ratio" && (h.cg==="wrapped-steth" || /^wsteth$/i.test(h.sym)));
  if(!hs.length) return;
  const r = await onchainRatio(); if(!r) return;
  hs.forEach(h=>{
    const prev = h.ratio;
    h.ratio = r; h.lastRatio = r;
    if(h.uPrice) h.price = h.uPrice*r;
    // первый раз перешли на точный курс: переставляем старт на него, чтобы не было ложного скачка
    if(!h.exact){
      h.exact = true;
      if(h.started && h.price){ h.bUnits = h.qty*r; h.bCost = h.qty*h.price;
        const st = h.events.find(e=>e.t==="start"); if(st){ st.r=r; st.p=h.price; } }
    } else if(prev && r < prev - 1e-9){ h.ratio = prev; h.lastRatio = prev; if(h.uPrice) h.price=h.uPrice*prev; }
  });
}
function recordHistory(){
  if(!S.hist) S.hist=[];
  let v=0,c=0; const per={};
  S.holdings.forEach(h=>{ const x=calc(h); v+=x.value; if(h.started) c+=x.cost; per[h.id]=Math.round(x.value*100)/100; });
  if(v<=0) return;
  const d=today(); const row={d, v:Math.round(v*100)/100, c:Math.round(c*100)/100, h:per};
  const i=S.hist.findIndex(x=>x.d===d); if(i>=0) S.hist[i]=row; else S.hist.push(row);
  S.hist.sort((a,b)=>a.d.localeCompare(b.d));
}
async function refreshPrices(manual){
  if(PX.busy) return; PX.busy=true; PX.err=null; if(manual) render();
  let ok=false, done=new Set();
  try{ done = await fromCoinGecko(); ok = done.size>0; }catch(e){}
  try{ const n = await fromBinance(done); ok = ok || n>0; }catch(e){}
  if(S.apiKey){
    for(const h of S.holdings.filter(h=>h.kind==="stock"&&h.ticker&&h.auto)){
      try{ const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(h.ticker)}&token=${encodeURIComponent(S.apiKey)}`); const q=await r.json();
        if(q && q.c>0){ h.price=q.c*fx(); h.priceAt=Date.now(); h.src="live"; ok=true; } }catch(e){}
    }
  }
  try{ await applyOnchain(); }catch(e){}
  if(ok){ S.holdings.forEach(startIfReady); S.lastRefresh=Date.now(); recordHistory(); save(); }
  else if(manual || !S.lastRefresh || Date.now()-S.lastRefresh>15*60000){
    PX.err = location.protocol==="file:" ? "Цены не грузятся из файла на компе — открой по ссылке GitHub Pages." : "Не получилось обновить цены. Попробуй через минуту.";
  }
  PX.busy=false; render();
}

function lineChart(pts, key, opts={}){
  if(pts.length<2) return `<p class="note">График появится, когда наберётся хотя бы два дня данных. Приложение само записывает стоимость раз в день, когда ты его открываешь.</p>`;
  const W=320,H=150,pl=4,pr=4,pt=10,pb=22;
  const vals=pts.map(p=>p[key]); const costs=opts.cost?pts.map(p=>p.c):[];
  const all=vals.concat(costs).filter(v=>v>0); let mn=Math.min(...all), mx=Math.max(...all); if(mx-mn<1e-6){ mx+=1; mn-=1; } const padv=(mx-mn)*0.12; mn-=padv; mx+=padv;
  const t0=new Date(pts[0].d).getTime(), t1=new Date(pts[pts.length-1].d).getTime(); const span=Math.max(1,t1-t0);
  const X=d=>pl+(new Date(d).getTime()-t0)/span*(W-pl-pr), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  const area=path+`L${X(pts[pts.length-1].d).toFixed(1)},${H-pb}L${X(pts[0].d).toFixed(1)},${H-pb}Z`;
  const cpath=opts.cost?pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p.c).toFixed(1)}`).join(""):"";
  const up = vals[vals.length-1] >= (opts.cost?pts[pts.length-1].c:vals[0]);
  const col = up?"var(--sage)":"var(--rose)";
  const f=d=>{ const [y,m,dd]=d.split("-").map(Number); return `${dd} ${MONTHS_G[m-1].slice(0,3)}`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Стоимость по дням">
    <path d="${area}" fill="${col}" opacity=".12"/>${cpath?`<path d="${cpath}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`:""}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)" font-family="Onest,sans-serif">${f(pts[0].d)}</text>
    <text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Onest,sans-serif">${f(pts[pts.length-1].d)}</text></svg>
    ${opts.cost?`<div class="cap"><span><span class="dot" style="background:${col}"></span>Стоимость</span><span><span class="dot" style="background:var(--muted)"></span>Вложено</span></div>`:""}`;
}
function histRange(days){ const h=(S.hist||[]); if(!days) return h; const from=new Date(Date.now()-days*864e5); const fs=from.getFullYear()+"-"+String(from.getMonth()+1).padStart(2,"0")+"-"+String(from.getDate()).padStart(2,"0"); return h.filter(x=>x.d>=fs); }

  });

const sheet=document.getElementById("sheet"), sheetIn=document.getElementById("sheetIn"), scrim=document.getElementById("scrim");
function openSheet(html){ sheetIn.innerHTML=`<div class="grab"></div>`+html; scrim.classList.add("on"); sheet.classList.add("on"); }
function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); }
scrim.onclick=closeSheet; document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

function openTx(t){
  const edit=!!t;
  const st={type:t?t.type:"out", cat:t?t.cat:null, amt:t?String(t.amt).replace(".",","):"", date:t?t.date:today(), note:t?t.note:""};
  const keep=()=>{ st.amt=$("fAmt").value; st.date=$("fDate").value; st.note=$("fNote").value; };
  const draw=first=>{
    const cats=st.type==="in"?IN_CATS:OUT_CATS; if(!cats.find(c=>c[0]===st.cat)) st.cat=null;
    openSheet(`<h3>${edit?"Изменить операцию":"Новая операция"}</h3>
      <div class="seg"><button data-ty="out" class="${st.type==="out"?"on":""}">Расход</button><button data-ty="in" class="${st.type==="in"?"on":""}">Доход</button></div>
      <div class="amt"><input id="fAmt" inputmode="decimal" placeholder="0" aria-label="Сумма" value="${esc(st.amt)}"><span>€</span></div>
      <div class="chips">${cats.map(c=>`<button class="chip ${st.cat===c[0]?"on":""}" data-cat="${esc(c[0])}">${c[1]} ${esc(c[0])}</button>`).join("")}</div>
      <div class="grid2"><label class="f">Дата<input type="date" id="fDate" value="${esc(st.date)}"></label><label class="f">Заметка<input id="fNote" placeholder="Например, Billa" value="${esc(st.note)}"></label></div>
      <div class="actions">${edit?`<button class="btn danger" id="del">Удалить</button>`:""}<button class="btn" id="ok">${edit?"Сохранить":"Добавить"}</button></div>`);
    sheetIn.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{ keep(); st.type=b.dataset.ty; draw(false); });
    sheetIn.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ st.cat=b.dataset.cat; sheetIn.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x===b)); });
    $("ok").onclick=()=>{ keep(); const amt=num(st.amt);
      if(!(amt>0)){ toast("Впиши сумму больше нуля"); $("fAmt").focus(); return; }
      if(!st.cat){ toast("Выбери категорию"); return; } if(!st.date){ toast("Выбери дату"); return; }
      const rec={type:st.type,amt:Math.round(amt*100)/100,cat:st.cat,date:st.date,note:st.note.trim()};
      if(edit) Object.assign(t,rec); else S.tx.push(Object.assign({id:uid(),ts:Date.now()},rec));
      save(); closeSheet(); const [y,m]=st.date.split("-").map(Number); UI.y=y; UI.m=m-1; render(); toast(edit?"Сохранено":"Добавлено"); };
    const d=$("del"); if(d) d.onclick=()=>{ if(!confirm("Удалить эту операцию?")) return; S.tx=S.tx.filter(x=>x.id!==t.id); save(); closeSheet(); render(); toast("Удалено"); };
    if(first&&!edit) setTimeout(()=>$("fAmt").focus(),250);
  };
  draw(true);
}

/* holding detail */
function openHold(h){
  const x=calc(h), r=R(h);
  const priceLine = canPrice(h) ? `${money(h.price)} за 1 ${esc(h.sym)} · ${h.src==="live"?"вживую, "+ago(h.priceAt):"введено вручную"}` : "Цены пока нет";
  const ratioLine = h.mode==="ratio" && r ? `<p class="hint">1 ${esc(h.sym)} = ${fmt(r,4)} ${esc(h.underSym)}. ${h.exact?"Курс берётся напрямую из контракта Lido, без рыночного шума.":"Стейкинг копится в этом курсе, а не в количестве."}</p>` : "";
  const stakeUnitsTxt = h.mode==="ratio" ? `${sign(x.stakeUnits)}${qty(Math.abs(x.stakeUnits))} ${esc(h.underSym)}` : `${sign(x.stakeUnits)}${qty(Math.abs(x.stakeUnits))} ${esc(h.sym)}`;
  const ev = (h.events||[]).slice(-8).reverse().map(e=>{
    const lbl={start:"Старт учёта",buy:"Докупил",sell:"Продал",reward:"Награды"}[e.t];
    const dq = e.t==="start"?`${qty(e.q)}`:`${e.dq>=0&&e.t!=="sell"?"+":"−"}${qty(Math.abs(e.dq))}`;
    return `<div><span>${dstr(e.d)} · ${lbl}</span><span>${dq} ${esc(h.sym)}</span></div>`; }).join("");
  openSheet(`
    <div class="dh"><span class="coin" style="background:${colorOf(h)}">${badge(h)}</span><div><h3 style="margin:0">${esc(h.name||h.sym)}</h3><span class="sub">${esc(h.place||"")}${h.apy?` · ${fmt(h.apy,2)}% APY`:""}</span></div></div>
    <p class="hint" style="margin:10px 0 4px">${priceLine}</p>${ratioLine}
    ${h.started?`<div class="split in"><div><small>Сейчас</small><strong>${money(x.value)}</strong></div><div><small>На старте</small><strong>${money(x.cost)}</strong></div>
      <div><small>От курса</small><strong class="${pos(x.pe)?"pos":"neg"}">${signed(x.pe)}</strong></div><div><small>От стейкинга</small><strong class="gold">${signed(x.se)}</strong><em>${stakeUnitsTxt}</em></div></div>`:""}
    <div class="actions" style="flex-wrap:wrap">
      ${h.mode!=="ratio"?`<button class="btn" data-act="reward">Записать награды</button>`:""}
      <button class="btn ghost" data-act="buy">Докупил</button><button class="btn ghost" data-act="sell">Продал</button>
    </div>
    ${!canPrice(h)||h.src!=="live"?`<div class="actions"><button class="btn ghost" data-act="price">Ввести цену вручную</button></div>`:""}
    ${(S.hist||[]).filter(p=>p.h&&p.h[h.id]!=null).length>1?`<div class="chart" style="margin:6px 0 10px">${lineChart((S.hist||[]).filter(p=>p.h&&p.h[h.id]!=null).map(p=>({d:p.d,v:toShow(p.h[h.id])})),"v")}</div>`:""}
    ${ev?`<div class="snaps"><div><b>История</b><span></span></div>${ev}</div>`:""}
    <div class="actions"><button class="btn ghost" data-act="pos">Ещё позиция ${esc(h.sym)}</button></div>
    <div class="actions"><button class="btn ghost" data-act="edit">Настройки</button><button class="btn danger" data-act="del">Удалить</button></div>`);
  sheetIn.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="del"){ if(!confirm(`Удалить ${h.sym} и всю историю?`)) return; S.holdings=S.holdings.filter(z=>z.id!==h.id); save(); closeSheet(); render(); toast("Удалено"); }
    else if(a==="edit") openHoldSettings(h);
    else if(a==="price") openPrice(h);
    else if(a==="pos") openNewPosition(h);
    else openQty(h,a);
  });
}
function openQty(h,a){
  if(!canPrice(h)){ toast("Сначала нужна цена"); openPrice(h); return; }
  const titles={reward:"Записать награды",buy:"Докупил",sell:"Продал"};
  const body = a==="reward"
    ? `<p class="hint">Впиши, сколько ${esc(h.sym)} сейчас всего (как видишь в кошельке). Разница с прошлым разом засчитается как награды стейкинга.</p><label class="f">Сейчас всего, ${esc(h.sym)}<input id="qN" inputmode="decimal" value="${String(h.qty).replace(".",",")}"></label>`
    : `<p class="hint">${a==="buy"?"Сколько докупил. Считаем по текущей цене — она станет частью стартовой суммы.":"Сколько продал. Стартовая сумма уменьшится пропорционально."}</p><label class="f">Количество, ${esc(h.sym)}<input id="qN" inputmode="decimal" placeholder="0"></label>
       <label class="f">Цена за 1 ${esc(h.sym)}, ${sym()}<input id="qP" inputmode="decimal" value="${fmt(toShow(h.price),2).replace(/\s/g,"")}"></label>`;
  openSheet(`<h3>${titles[a]} · ${esc(h.sym)}</h3>${body}<div class="actions"><button class="btn ghost" id="qBack">Назад</button><button class="btn" id="qOk">Сохранить</button></div>`);
  $("qBack").onclick=()=>openHold(h);
  $("qOk").onclick=()=>{
    const n=num($("qN").value); if(!(n>=0)){ toast("Впиши количество"); return; }
    if(a==="reward"){ if(n<h.qty){ toast("Если стало меньше — это продажа, а не награды"); return; } if(n===h.qty){ closeSheet(); return; } applyEvent(h,"reward",n); }
    else { if(!(n>0)){ toast("Впиши количество больше нуля"); return; }
      const p=num($("qP").value); if(p>0){ const pe=fromShow(p); if(h.mode==="ratio"&&h.uPrice){ /* keep ratio consistent */ } h.price=pe; }
      if(a==="sell"&&n>h.qty){ toast("Нельзя продать больше, чем есть"); return; }
      if(!h.started){ h.pending=(h.pending||0)+(a==="buy"?n:0); startIfReady(h); } else applyEvent(h,a,n); }
    save(); render(); openHold(h); toast("Сохранено");
  };
}
function openPrice(h){
  const ratio = h.mode==="ratio";
  openSheet(`<h3>Цена ${esc(h.sym)} вручную</h3>
    <p class="hint">Используй, если живая цена не подтянулась. В ${sym()}.</p>
    <label class="f">Цена за 1 ${esc(h.sym)}, ${sym()}<input id="pP" inputmode="decimal" value="${h.price!=null?fmt(toShow(h.price),2).replace(/\s/g,""):""}"></label>
    ${ratio?`<label class="f">Цена за 1 ${esc(h.underSym)}, ${sym()}<input id="pU" inputmode="decimal" value="${h.uPrice!=null?fmt(toShow(h.uPrice),2).replace(/\s/g,""):""}"></label>`:""}
    ${!h.started?`<label class="f">Сколько у тебя сейчас, ${esc(h.sym)}<input id="pQ" inputmode="decimal" value="${String(h.pending??h.qty??0).replace(".",",")}"></label><p class="hint">С этого момента начнётся учёт.</p>`:""}
    <div class="actions"><button class="btn ghost" id="pBack">Назад</button><button class="btn" id="pOk">Сохранить</button></div>`);
  $("pBack").onclick=()=>openHold(h);
  $("pOk").onclick=()=>{
    const p=num($("pP").value); if(!(p>0)){ toast("Впиши цену"); return; }
    if(ratio){ const u=num($("pU").value); if(!(u>0)){ toast(`Впиши цену ${h.underSym}`); return; } h.uPrice=fromShow(u); }
    h.price=fromShow(p); h.src="manual"; h.priceAt=Date.now();
    if(!h.started){ const q=num($("pQ").value); h.pending=q>0?q:0; startIfReady(h); }
    save(); render(); openHold(h); toast("Сохранено");
  };
}
function openHoldSettings(h){
  openSheet(`<h3>Настройки ${esc(h.sym)}</h3>
    <div class="grid2"><label class="f">Название<input id="sN" value="${esc(h.name||"")}"></label><label class="f">Где лежит<input id="sPl" value="${esc(h.place||"")}"></label>

    <div class="actions"><button class="btn ghost" id="sBack">Назад</button><button class="btn" id="sOk">Сохранить</button></div>`);

}

async function priceOne(h){
  try{
    const r=await fetch(`${CG}/simple/price?ids=${encodeURIComponent(h.cg)},tether&vs_currencies=eur,usd`,{cache:"no-store"});
    if(r.ok){ const j=await r.json();
      if(j.tether&&j.tether.eur&&j.tether.usd) S.fx={usdEur:j.tether.eur/j.tether.usd,at:Date.now()};
      if(j[h.cg]&&j[h.cg].eur!=null){ h.price=j[h.cg].eur; h.priceAt=Date.now(); h.src="live"; return true; } }
  }catch(e){}
  try{ const n=await fromBinance(new Set(S.holdings.filter(x=>x.id!==h.id).map(x=>x.id))); if(n>0) return true; }catch(e){}
  return false;
}
function openNewCoin(h){
  openSheet(`<h3>${esc(h.name||h.sym)}</h3>
    <p class="hint" id="ncSt">Загружаю цену…</p>
    <label class="f">Сколько у тебя сейчас, ${esc(h.sym.toUpperCase())}<input id="ncQ" inputmode="decimal" placeholder="0"></label>
    <div id="ncMan" hidden><label class="f">Цена за 1 ${esc(h.sym.toUpperCase())}, ${sym()}<input id="ncP" inputmode="decimal" placeholder="0"></label></div>
    <div class="actions"><button class="btn ghost" id="ncBack">Отмена</button><button class="btn" id="ncOk">Добавить</button></div>`);
  let live=false;
  const cancel=()=>{ S.holdings=S.holdings.filter(x=>x.id!==h.id); save(); closeSheet(); render(); };
  $("ncBack").onclick=cancel;
  priceOne(h).then(ok=>{ if(!$("ncSt")) return; live=ok;
    if(ok){ $("ncSt").textContent=`Цена сейчас: ${money(h.price)} за 1 ${h.sym.toUpperCase()}`; }
    else { $("ncSt").textContent="Живая цена не подтянулась (CoinGecko занят или монеты нет на биржах). Впиши цену вручную — позже она обновится сама, если появится."; $("ncMan").hidden=false; } });
  $("ncOk").onclick=()=>{
    const q=num($("ncQ").value); if(!(q>0)){ toast("Впиши количество"); return; }
    if(!live){ const p=num($("ncP")?$("ncP").value:""); if(!(p>0)){ toast($("ncMan").hidden?"Подожди, цена ещё грузится":"Впиши цену"); return; } h.price=fromShow(p); h.src="manual"; h.priceAt=Date.now(); }
    h.pending=q; startIfReady(h); save(); closeSheet(); UI.tab="port"; render(); toast("Добавлено");
  };
  setTimeout(()=>$("ncQ")&&$("ncQ").focus(),250);
}
function openNewPosition(base){
  openSheet(`<h3>Ещё одна позиция ${esc(base.sym)}</h3>
    <p class="hint">Например, ${esc(base.sym)}, который просто лежит в кошельке, отдельно от того, что в стейке. Цена общая, учёт — отдельный.</p>
    <label class="f">Где лежит<input id="nPl" placeholder="Кошелёк, не в стейке"></label>
    <label class="f">Сколько, ${esc(base.sym)}<input id="nQ" inputmode="decimal" placeholder="0"></label>
    <div class="actions"><button class="btn ghost" id="nBack">Отмена</button><button class="btn" id="nOk">Добавить</button></div>`);
  $("nBack").onclick=closeSheet;
  $("nOk").onclick=()=>{
    const q=num($("nQ").value); if(!(q>0)){ toast("Впиши количество"); return; }
    const h=mkHold({kind:base.kind,sym:base.sym,name:base.name,cg:base.cg,ticker:base.ticker,mode:base.mode,under:base.under,underSym:base.underSym,
      place:$("nPl").value.trim()||"Кошелёк",apy:0,price:base.price,uPrice:base.uPrice,src:base.src,priceAt:base.priceAt,pending:q});
    startIfReady(h); S.holdings.push(h); save(); UI.tab="port"; render();
    if(h.started){ closeSheet(); toast("Добавлено"); } else openPrice(h);
  };
}
function openManualCoin(){
  openSheet(`<h3>Монета вручную</h3>
    <p class="hint">Если поиск не работает. Цену потом можно обновить кнопкой в карточке монеты. Если знаешь ID на CoinGecko — впиши, тогда цена будет подтягиваться.</p>
    <div class="grid2"><label class="f">Тикер<input id="mS" placeholder="SOL"></label><label class="f">Где лежит<input id="mPl" placeholder="Кошелёк"></label>
    <label class="f">Сколько<input id="mQ" inputmode="decimal" placeholder="0"></label><label class="f">Цена за 1, ${sym()}<input id="mP" inputmode="decimal" placeholder="0"></label></div>
    <label class="f">ID на CoinGecko (необязательно)<input id="mC" placeholder="например, solana" autocomplete="off"></label>
    <div class="actions"><button class="btn ghost" id="mBack">Отмена</button><button class="btn" id="mOk">Добавить</button></div>`);
  $("mBack").onclick=closeSheet;
  $("mOk").onclick=()=>{
    const t=$("mS").value.trim(); if(!t){ toast("Впиши тикер"); return; }
    const q=num($("mQ").value), p=num($("mP").value);
    const cg=$("mC").value.trim().toLowerCase()||null;
    const same = cg ? S.holdings.find(h=>h.cg===cg) : S.holdings.find(h=>h.sym.toLowerCase()===t.toLowerCase());
    const h=mkHold({kind:"crypto",sym:t,name:same?same.name:t,cg:cg||(same?same.cg:null),mode:same?same.mode:"plain",under:same?same.under:null,underSym:same?same.underSym:null,
      place:$("mPl").value.trim()||"Кошелёк",pending:q>0?q:0});
    if(p>0){ h.price=fromShow(p); h.src="manual"; h.priceAt=Date.now(); } else if(same){ h.price=same.price; h.uPrice=same.uPrice; h.src=same.src; h.priceAt=same.priceAt; }
    startIfReady(h); S.holdings.push(h); save(); closeSheet(); UI.tab="port"; render(); toast("Добавлено");
  };
}

/* more */
function applyTheme(){ let th=""; try{ th=localStorage.getItem("karman.theme")||""; }catch(e){} if(th) document.documentElement.setAttribute("data-theme",th); else document.documentElement.removeAttribute("data-theme"); }
applyTheme();
function importData(raw){
  try{ let s=JSON.parse(raw); if(!s) throw 0;
    if(s.v!==2){ if(Array.isArray(s.holdings)&&Array.isArray(s.tx)) s=migrateV1(s); else throw 0; }
    if(!Array.isArray(s.holdings)||!Array.isArray(s.tx)) throw 0;
    if(!confirm("Заменить текущие данные данными из копии?")) return;
    S=s; save(); render(); toast("Восстановлено"); refreshPrices(false);
  }catch(e){ toast("Это не похоже на копию Кармана"); }
}
function bindMore(){
  document.querySelectorAll("#curSeg button").forEach(b=>b.onclick=()=>{ S.show=b.dataset.cur; save(); render(); });
  document.querySelectorAll("#themeSeg button").forEach(b=>b.onclick=()=>{ try{ localStorage.setItem("karman.theme",b.dataset.th); }catch(e){} applyTheme(); render(); });
  $("dlExp").onclick=()=>{ const blob=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`karman-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast("Файл сохранён"); };
  $("copyExp").onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast("Скопировано"); }catch(e){ const ta=$("imp"); ta.value=JSON.stringify(S); ta.focus(); ta.select(); toast("Выделил текст ниже — скопируй его"); } };
  $("doImp").onclick=()=>importData($("imp").value.trim());
  $("impFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>importData(String(rd.result)); rd.readAsText(f); };
  $("saveKey").onclick=()=>{ S.apiKey=$("apiKey").value.trim(); save(); toast(S.apiKey?"Ключ сохранён":"Ключ удалён"); refreshPrices(false); };
  $("reset").onclick=()=>{ if(!confirm("Точно удалить все данные? Это нельзя отменить.")) return; S=blank(); save(); render(); refreshPrices(false); toast("Данные удалены"); };
}

let tt; function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1900); }

save(); render(); refreshPrices(false);
setInterval(()=>{ if(document.visibilityState==="visible") refreshPrices(false); }, 180000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-(S.lastRefresh||0)>60000) refreshPrices(false); });
})();
